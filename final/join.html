    <main>
        <section class="recipe-form-section">
    <h2>Submit a Recipe</h2>

    <form id="recipeForm">
        <label>
            Recipe Name:
            <input type="text" id="name" required>
        </label>

        <label>
            Description:
            <textarea id="description" required></textarea>
        </label>

        <label>
            Ingredients (one per line):
            <textarea id="ingredients" required></textarea>
        </label>

        <label>
            Steps (one per line):
            <textarea id="steps" required></textarea>
        </label>

        <label>
            Time Required:
            <input type="text" id="time" placeholder="e.g., 30 minutes" required>
        </label>

        <label>
            Estimated Cost:
            <input type="text" id="cost" placeholder="e.g., $12" required>
        </label>

        <label>
            Image URL:
            <input type="url" id="image" placeholder="https://example.com/photo.jpg" required>
        </label>

        <button type="submit" class="submit-btn">Submit My recipe</button>
    </form>

</section>
